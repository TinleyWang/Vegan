<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="對照台灣全素／純素定義，判讀中日韓英文包裝食品成分表。">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F5F4EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12150F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="全素成分檢查">
<style>
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>全素成分檢查</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap">
<style>
:root{
  --paper:#F5F4EE; --surface:#FFFFFF; --surface-2:#EFEEE6;
  --ink:#1B211C; --ink-2:#4A524B; --ink-3:#7C837C;
  --line:#DEDCD1; --line-2:#C9C7B9;
  --accent:#2F6B4F; --accent-soft:#E2EDE5; --on-accent:#FFFFFF;
  --red:#A62A1F; --red-bg:#FBE9E6; --red-line:#E8BDB6;
  --amber:#9A6206; --amber-bg:#FBF0DC; --amber-line:#E8D0A0;
  --green:#1E6B48; --green-bg:#E4F0E7; --green-line:#B4D4BE;
  --radius:10px;
  --ff-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --ff-disp:"Noto Serif TC",Georgia,"Songti TC",serif;
  --ff-mono:ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#12150F; --surface:#1A1E17; --surface-2:#222720;
    --ink:#E9EBE2; --ink-2:#B2B8AD; --ink-3:#848A80;
    --line:#2E342B; --line-2:#3E453A;
    --accent:#77C095; --accent-soft:#1E2B22; --on-accent:#11150F;
    --red:#F08074; --red-bg:#2E1A17; --red-line:#5B2C25;
    --amber:#E0A84F; --amber-bg:#2C2314; --amber-line:#57431F;
    --green:#5FBB89; --green-bg:#152A1F; --green-line:#2A4D38;
  }
}
:root[data-theme="dark"]{
  --paper:#12150F; --surface:#1A1E17; --surface-2:#222720;
  --ink:#E9EBE2; --ink-2:#B2B8AD; --ink-3:#848A80;
  --line:#2E342B; --line-2:#3E453A;
  --accent:#77C095; --accent-soft:#1E2B22; --on-accent:#11150F;
  --red:#F08074; --red-bg:#2E1A17; --red-line:#5B2C25;
  --amber:#E0A84F; --amber-bg:#2C2314; --amber-line:#57431F;
  --green:#5FBB89; --green-bg:#152A1F; --green-line:#2A4D38;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ff-body);
  font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:0 18px;padding-block:0 56px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* header */
header{padding-block:26px 18px;border-bottom:1px solid var(--line)}
h1{font-family:var(--ff-disp);font-weight:700;font-size:1.65rem;margin:0;letter-spacing:.02em}
.sub{margin:6px 0 0;color:var(--ink-2);font-size:.86rem;line-height:1.5}
.stdrow{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}
.std{display:inline-flex;align-items:center;gap:6px;font-size:.73rem;
  letter-spacing:.06em;color:var(--accent);background:var(--accent-soft);
  border:1px solid var(--line);padding:4px 10px;border-radius:99px}
.std.alt{color:var(--ink-2);background:var(--surface-2)}
.std.tog{border-color:var(--line-2);font-family:inherit}
.std.tog[aria-pressed="false"]{color:var(--ink-3);background:transparent}

/* tabs */
.tabs{display:flex;gap:0;margin-top:22px;border:1px solid var(--line-2);border-radius:var(--radius);
  overflow:hidden;background:var(--surface)}
.tabs button{flex:1;border:0;background:transparent;padding:11px 8px;font-size:.92rem;
  font-weight:500;color:var(--ink-2);border-right:1px solid var(--line)}
.tabs button:last-child{border-right:0}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--on-accent);font-weight:700}
.pane{margin-top:14px}

textarea{width:100%;min-height:150px;padding:13px;border:1px solid var(--line-2);
  border-radius:var(--radius);background:var(--surface);color:var(--ink);
  font-family:var(--ff-body);font-size:.95rem;line-height:1.7;resize:vertical}
.hint{font-size:.8rem;color:var(--ink-3);margin:8px 0 0;line-height:1.55}

.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--radius);
  padding:11px 16px;font-size:.92rem;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);flex:1;min-width:150px}
.btn.primary:disabled{opacity:.5;cursor:default}
.btn.ghost{color:var(--ink-2)}

.drop{border:1.5px dashed var(--line-2);border-radius:var(--radius);background:var(--surface);
  padding:26px 18px;text-align:center}
.drop p{margin:0 0 14px;color:var(--ink-2);font-size:.88rem;line-height:1.6}
input[type=file]{display:none}
.shot{margin-top:12px;border:1px solid var(--line);border-radius:var(--radius);
  max-width:100%;display:block}
.status{margin-top:12px;font-size:.87rem;color:var(--ink-2);display:flex;gap:8px;align-items:baseline}
.status.err{color:var(--red)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none;
  align-self:center;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dot{animation:none;opacity:.7}}

/* verdict */
#verdict{margin-top:26px}
.vbox{border-radius:var(--radius);padding:18px 18px 16px;border:1px solid}
.vbox.red{background:var(--red-bg);border-color:var(--red-line)}
.vbox.amber{background:var(--amber-bg);border-color:var(--amber-line)}
.vbox.green{background:var(--green-bg);border-color:var(--green-line)}
.vhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.vmark{font-family:var(--ff-disp);font-size:1.5rem;font-weight:700;line-height:1.2}
.vbox.red .vmark{color:var(--red)} .vbox.amber .vmark{color:var(--amber)} .vbox.green .vmark{color:var(--green)}
.vcount{font-size:.78rem;color:var(--ink-2);font-variant-numeric:tabular-nums;letter-spacing:.03em}
.vwhy{margin:8px 0 0;font-size:.9rem;color:var(--ink-2);line-height:1.6}

/* findings */
h2{font-family:var(--ff-disp);font-size:1rem;font-weight:700;margin:28px 0 10px;
  letter-spacing:.03em;display:flex;align-items:baseline;gap:8px}
h2 small{font-family:var(--ff-body);font-weight:400;font-size:.76rem;color:var(--ink-3);letter-spacing:.04em}
ul.finds{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
ul.finds li{background:var(--surface);padding:12px 14px 12px 12px;display:flex;gap:11px;align-items:flex-start}
.stripe{width:3px;align-self:stretch;border-radius:2px;flex:none;margin-top:2px}
.stripe.red{background:var(--red)} .stripe.amber{background:var(--amber)} .stripe.ok{background:var(--green)}
.fmain{flex:1;min-width:0}
.fterm{font-weight:700;font-size:.97rem}
.fmeta{font-size:.76rem;color:var(--ink-3);letter-spacing:.04em;margin-left:7px;font-weight:400}
.fwhy{font-size:.845rem;color:var(--ink-2);margin:3px 0 0;line-height:1.55}
.fsrc{font-size:.72rem;color:var(--ink-3);margin:5px 0 0;letter-spacing:.03em}
.facts{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);background:var(--surface-2);border-radius:99px;
  padding:4px 11px;font-size:.76rem;color:var(--ink-2);line-height:1.4}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:500}
.ans{margin:9px 0 0;font-size:.83rem;color:var(--ink-2);background:var(--surface-2);
  border-left:2px solid var(--accent);padding:8px 11px;border-radius:0 6px 6px 0;line-height:1.6;
  white-space:pre-wrap}

/* marked text */
.marked{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;font-size:.9rem;line-height:2;word-break:break-word}
mark{padding:1px 2px;border-radius:3px;background:transparent;font-weight:700}
mark.red{color:var(--red);box-shadow:inset 0 -.55em 0 var(--red-bg)}
mark.amber{color:var(--amber);box-shadow:inset 0 -.55em 0 var(--amber-bg)}
mark.ok{color:var(--green);box-shadow:inset 0 -.55em 0 var(--green-bg)}

/* layers */
ol.layers{list-style:none;margin:0;padding:0;counter-reset:l}
ol.layers li{counter-increment:l;display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
ol.layers li:last-child{border-bottom:0}
ol.layers li::before{content:counter(l);font-family:var(--ff-mono);font-size:.72rem;color:var(--ink-3);
  border:1px solid var(--line-2);width:21px;height:21px;border-radius:50%;display:grid;
  place-items:center;flex:none;margin-top:2px}
.lname{font-weight:500;font-size:.9rem}
.lres{font-size:.83rem;color:var(--ink-2);margin:1px 0 0;line-height:1.55}
.lres b.hit{color:var(--red)} .lres b.pass{color:var(--green)} .lres b.na{color:var(--ink-3);font-weight:400}

/* history */
ul.hist{list-style:none;margin:0;padding:0}
ul.hist li{display:flex;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);
  font-size:.86rem}
ul.hist li:last-child{border-bottom:0}
.hdot{width:8px;height:8px;border-radius:50%;flex:none;align-self:center}
.hdot.red{background:var(--red)} .hdot.amber{background:var(--amber)} .hdot.green{background:var(--green)}
.htxt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.hts{font-size:.74rem;color:var(--ink-3);font-variant-numeric:tabular-nums;flex:none}

footer{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);
  font-size:.79rem;color:var(--ink-3);line-height:1.7}
footer b{color:var(--ink-2);font-weight:500}
footer ul{margin:7px 0 0;padding-left:1.15em}
.hide{display:none!important}
</style>

<body>
<div class="wrap">
<header>
  <span class="eyebrow">VEGAN FOOD CHECK</span>
  <h1>全素成分檢查</h1>
  <p class="sub">檢查食品是否符合全素標準，並列出不能吃或需要確認的原因。</p>
</header>
<main class="input-shell">
<div class="mode-tabs" role="tablist">
  <button id="mode-text" role="tab" aria-selected="true" aria-controls="text-pane">貼上文字</button>
  <button id="mode-photo" role="tab" aria-selected="false" aria-controls="photo-pane">加入照片</button>
</div>
<section class="pane" id="text-pane" role="tabpanel" aria-labelledby="mode-text">
  <label for="src" class="field-label"><span>食品成分</span></label>
  <textarea id="src" spellcheck="false" placeholder="把包裝上的成分表貼在這裡⋯⋯"></textarea>
  <div class="row">
    <button class="btn primary" id="go">查看結果</button>
  </div>
</section>
<section class="pane photo-pane hide" id="photo-pane" role="tabpanel" aria-labelledby="mode-photo">
  <label class="upload-zone" for="photo-file" id="photo-drop">
    <span class="upload-icon" aria-hidden="true">＋</span>
    <b>選擇或拍攝成分表</b>
    <span>也可以直接把照片貼到這裡</span>
  </label>
  <input type="file" id="photo-file" accept="image/*" capture="environment" hidden>
  <img id="photo-preview" class="photo-preview hide" alt="已選取的食品成分照片">
  <p id="photo-note" class="photo-note hide"><b>照片已加入。</b>請長按照片使用手機的「拷貝文字」，再切回「貼上文字」完成檢查。</p>
</section>
</main>
<div id="verdict"></div>
<div id="out"></div>
</div>

<script>
/* ── 正規化：全形→半形、常見簡體→繁體，長度 1:1 以保留索引 ── */
const S2T={"鸡":"雞","胶":"膠","剂":"劑","红":"紅","虫":"蟲","黄":"黃","脱":"脫","猪":"豬",

"钠":"鈉","镁":"鎂","铁":"鐵","纤":"纖","谷":"穀","淀":"澱","葱":"蔥","荞":"蕎","兴":"興",
"纯":"純","标":"標","产":"產","过":"過","类":"類","制":"製","苏":"蘇","饮":"飲",
"组":"組","织":"織","团":"團","颜":"顏","为":"為","胨":"腖","酵":"酵","脏":"臟"};
function norm(s){let o="";for(const ch of s){const c=ch.codePointAt(0);
  if(c>=0xFF01&&c<=0xFF5E)o+=String.fromCharCode(c-0xFEE0);
  else if(ch==="　")o+=" ";else o+=(S2T[ch]||ch);}return o;}

/* 索引用正規化後的字形建鍵：日文新字體（脱脂粉乳、卵黄）經 norm() 會變成
   繁體字形，若只用原字串當鍵就永遠比對不到 */
const IDX=new Map(); let MAXL=1; const LAT=[];
for(const r of R){
  if(/^[\x20-\x7E]+$/.test(r.t)){ LAT.push(r); continue; }
  for(const key of new Set([r.t,norm(r.t)])){
    if(!IDX.has(key)){ IDX.set(key,r); MAXL=Math.max(MAXL,key.length); }
  }
}
LAT.sort((a,b)=>b.t.length-a.t.length);

/* ── 掃描：CJK／諺文逐字最長比對；拉丁字母另跑一輪，帶詞界與複數 ── */
function scan(raw){
  const n=norm(raw), hits=[], used=new Uint8Array(n.length);
  let i=0;
  while(i<n.length){
    let m=null;
    for(let L=Math.min(MAXL,n.length-i);L>0;L--){
      const r=IDX.get(n.slice(i,i+L));
      if(r){m=r;break;}
    }
    if(m){ const e=i+m.t.length; hits.push({s:i,e,r:m}); for(let k=i;k<e;k++)used[k]=1; i=e; }
    else i++;
  }
  const low=n.toLowerCase(), wc=c=>/[a-z0-9]/.test(c||"");
  for(const r of LAT){
    const t=r.t.toLowerCase(); let j=0;
    while((j=low.indexOf(t,j))>=0){
      const a=j; let b=j+t.length;
      if(wc(low[a-1])&&wc(t[0])){ j=b; continue; }
      if(wc(low[b])&&wc(t[t.length-1])){
        const pl=/^(e?s)(?![a-z0-9])/.exec(low.slice(b));
        if(!pl){ j=b; continue; }
        b+=pl[1].length;
      }
      let free=true;
      for(let k=a;k<b;k++) if(used[k]){free=false;break;}
      if(free){ for(let k=a;k<b;k++)used[k]=1; hits.push({s:a,e:b,r}); }
      j=b;
    }
  }
  return hits.sort((x,y)=>x.s-y.s);
}

/* ── 語言偵測 ── */
function langs(s){
  const L=[], kana=/[぀-ゟ゠-ヿ]/.test(s), han=/[가-힯]/.test(s),
        cjk=/[一-鿿]/.test(s), lat=(s.match(/[A-Za-z]{4,}/g)||[]).length>=2;
  if(kana)L.push("日文"); if(han)L.push("韓文");
  if(cjk&&!kana)L.push("中文"); if(lat)L.push("英文");
  return L;
}

function vegLabel(raw){
  const n=norm(raw), low=n.toLowerCase();
  for(const x of VEG){
    const isLat=/^[\x20-\x7E]+$/.test(x.k);
    const i=isLat?low.indexOf(x.k.toLowerCase()):n.indexOf(x.k);
    if(i<0)continue;
    if(/not |non-|無|非|不是/.test(low.slice(Math.max(0,i-8),i)))continue;
    return x;
  }
  return null;
}

/* ── 第 2 層：過敏原警語（11 項強制標示，其中含蛋、牛奶羊奶） ── */
function allergen(raw){
  const n=norm(raw), low=n.toLowerCase(), out=[];
  const put=(a,seg,z)=>{ if(!out.some(x=>x.a===a))
    out.push({a,z,seg:seg.trim().split(/\n/).pop().trim().slice(-46)}); };
  const clean=s=>s.replace(/大豆蛋白|植物蛋白|蛋白質|乳化劑|乳酸|豆乳|乳化剤|두유|유화제|soy protein|plant protein|lactic acid|dairy-free|dairy free|milk thistle/gi,"");

  /* 台灣：11 項強制過敏原 */
  let m, re=/(本產品[^。；;\n]{0,12}?(?:含有|使用)|過敏原[：:]|含有)([^。；;\n]{0,60})/g;
  while((m=re.exec(n))){
    if(/[不未無非]/.test(n.slice(Math.max(0,m.index-2),m.index)))continue;
    const s=clean(m[2]);
    if(/蛋/.test(s)) put("蛋",m[0],"台灣");
    if(/牛奶|羊奶|乳|奶/.test(s)) put("奶",m[0],"台灣");
  }
  /* 日本：特定原材料 9 品目，寫作「(一部に○○を含む)」 */
  for(const mk of ["を含む","含む"]){
    let i=-1;
    while((i=n.indexOf(mk,i+1))>=0){
      const s=clean(n.slice(Math.max(0,i-60),i));
      const win=n.slice(Math.max(0,i-70),i+4);
      if(!/一部に|アレル|原材料/.test(win))continue;
      const from=s.lastIndexOf("一部に"), seg=(from>=0?s.slice(from):s.slice(-36))+mk;
      if(/卵|たまご|タマゴ|玉子/.test(s)) put("蛋",seg,"日本");
      if(/乳|ミルク|バター|チーズ/.test(s)) put("奶",seg,"日本");
    }
  }
  const jp=n.search(/アレルギー物質|アレルゲン/);
  if(jp>=0){ const s=clean(n.slice(jp,jp+70));
    if(/卵|たまご/.test(s)) put("蛋",n.slice(jp,jp+46),"日本");
    if(/乳/.test(s)) put("奶",n.slice(jp,jp+46),"日本");
  }
  /* 韓國：22 項，寫作「○○ 함유」或「알레르기 유발물질: …」 */
  let k=-1;
  while((k=n.indexOf("함유",k+1))>=0){
    const s=clean(n.slice(Math.max(0,k-50),k));
    if(/난류|알류|계란|달걀/.test(s)) put("蛋",n.slice(Math.max(0,k-36),k+2),"韓國");
    if(/우유|유당|유청|유크림/.test(s)) put("奶",n.slice(Math.max(0,k-36),k+2),"韓國");
  }
  const kp=n.search(/알레르기\s*유발\s*물질/);
  if(kp>=0){ const s=clean(n.slice(kp,kp+90));
    if(/난류|알류|계란|달걀/.test(s)) put("蛋",n.slice(kp,kp+46),"韓國");
    if(/우유|유당|유청/.test(s)) put("奶",n.slice(kp,kp+46),"韓國");
  }
  /* 歐美：FDA Big 9 / EU 14，寫作「Contains: Milk, Egg」 */
  re=/(?:^|[\s.;,)\]])(contains|may contain|allergens?|allergy advice)[:\s]([^.\n;]{0,80})/gi;
  while((m=re.exec(low))){
    if(/does not |doesn't |free of |no /.test(low.slice(Math.max(0,m.index-10),m.index+1)))continue;
    const s=clean(m[2]);
    if(/\begg/.test(s)) put("蛋",m[0],"歐美");
    if(/milk|dairy|butter|cheese|whey|casein|lactose|cream/.test(s)) put("奶",m[0],"歐美");
  }
  return out;
}

/* ── 個人裁決 + 歷史（db） ── */
let RULINGS={}, HIST=[];
const LSKEY="chengfen-hongludeng-v1";
const save=()=>{ try{ localStorage.setItem(LSKEY,
  JSON.stringify({map:RULINGS,allium:ALLIUM,items:HIST})); }catch(e){} };
function loadPrefs(){
  try{ const v=JSON.parse(localStorage.getItem(LSKEY)||"{}");
    RULINGS=v.map||{}; ALLIUM=v.allium||"exclude"; HIST=v.items||[];
  }catch(e){ RULINGS={}; HIST=[]; }
}

/* ── 判讀 ── */
let LAST=null, ALLIUM="exclude";
function judge(raw){
  const hits=scan(raw), vl=vegLabel(raw), al=allergen(raw), lg=langs(raw);
  const map=new Map(); let allium=0;
  for(const h of hits){
    if(h.r.lv==="ok")continue;
    if(h.r.cat==="五辛"&&ALLIUM==="allow"){allium++;continue;}
    const ruled=RULINGS[h.r.t];
    if(ruled==="accept")continue;
    const lv = ruled==="reject" ? "red" : h.r.lv;
    const k=h.r.t;
    if(!map.has(k))map.set(k,{...h.r,lv,ruled,n:0,at:h.s});
    map.get(k).n++;
  }
  const finds=[...map.values()].sort((a,b)=>(a.lv===b.lv?a.at-b.at:a.lv==="red"?-1:1));
  const red=finds.filter(f=>f.lv==="red"), amber=finds.filter(f=>f.lv==="amber");
  const labelRed = vl&&vl.v==="red", allergenRed = al.length>0;
  const foreignVegan = vl&&vl.v==="green"&&vl.z!=="台灣";

  let v="green", why;
  if(labelRed||allergenRed||red.length){ v="red";
    why = labelRed ? vl.m
      : allergenRed ? "過敏原警語已明確載明含"+al.map(x=>x.a).join("、")+"（"+al[0].z+"強制標示），可直接排除。"
      : foreignVegan ? "包裝雖標示 "+vl.k+"，但成分掃描仍命中 "+red.length+" 項排除成分 — 境外的 vegan 標示不排除五辛，請看下方明細。"
      : "成分表中出現 "+red.length+" 項明確排除成分。";
  } else if(amber.length){ v="amber";
    why="沒有明確的蛋奶或動物性成分，但有 "+amber.length+" 項來源無法從標示判定。裁決後這個工具會記住。";
  } else {
    why = vl&&vl.v==="green" ? vl.m+"，且成分掃描未再發現排除成分。"
      : "掃描未發現排除成分。注意這是「未發現」，不是「保證不含」— 加工助劑依法可不標示。";
  }
  if(allium) why+="（已依設定容許 "+allium+" 處五辛）";
  return {raw,hits,finds,red,amber,vl,al,v,why,lg,allium};
}

const VMARK={red:"不可食用",amber:"需確認",green:"未發現排除成分"};

function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}

function markup(raw,hits){
  let h="",p=0;
  for(const x of hits){
    const lv = x.r.lv==="ok" ? "ok" : (RULINGS[x.r.t]==="accept" ? "ok" : RULINGS[x.r.t]==="reject" ? "red" : x.r.lv);
    h+=esc(raw.slice(p,x.s))+'<mark class="'+lv+'">'+esc(raw.slice(x.s,x.e))+"</mark>";
    p=x.e;
  }
  return h+esc(raw.slice(p));
}

function render(){
  const V=document.getElementById("verdict"), O=document.getElementById("out");
  if(!LAST){V.innerHTML="";O.innerHTML="";return;}
  const d=LAST=judge(LAST.raw);
  V.innerHTML='<div class="vbox '+d.v+'"><div class="vhead"><span class="vmark">'+VMARK[d.v]+'</span>'+
    '</div><p class="vwhy">'+esc(d.why)+"</p></div>";
  let h="";
  if(d.finds.length){
    h+='<h2>原因</h2><ul class="finds">';
    for(const f of d.finds){
      h+='<li><span class="stripe '+f.lv+'"></span><div class="fmain">'+
        '<span class="fterm">'+esc(f.t)+'</span><span class="fmeta">'+esc(f.cat)+'</span>'+
        '<p class="fwhy">'+esc(f.why)+"</p>";
      h+="</div></li>";
    }
    h+="</ul>";
  }
  O.innerHTML=h;
}

function histHTML(){
  if(!HIST.length)return"";
  let h='<h2>最近查過 <small>'+HIST.length+" 筆</small></h2><ul class=\"hist\">";
  HIST.forEach((x,i)=>{h+='<li><span class="hdot '+x.v+'"></span><span class="htxt" data-hist="'+i+'" role="button" tabindex="0">'+esc(x.t)+'</span><span class="hts">'+esc(x.d)+"</span></li>";});
  return h+"</ul>";
}

function bindHist(){
  document.querySelectorAll("[data-hist]").forEach(el=>{
    const open=()=>{const x=HIST[+el.dataset.hist];if(!x)return;
      document.getElementById("src").value=x.raw; LAST={raw:x.raw}; render(); scrollTo({top:0,behavior:"smooth"});};
    el.onclick=open; el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open();}};
  });
}

function bindFinds(){
  document.querySelectorAll("[data-rule]").forEach(b=>b.onclick=()=>{
    const t=b.dataset.t;
    if(b.dataset.rule==="clear")delete RULINGS[t]; else RULINGS[t]=b.dataset.rule;
    save("prefs/rulings",{map:RULINGS,allium:ALLIUM}); render();
  });
  document.querySelectorAll("[data-ask]").forEach(b=>b.onclick=()=>ask(b.dataset.ask,b));
}

/* ── 問 Claude 單一成分 ── */
let SAMPLE=null;
async function ask(term,btn){
  const box=document.getElementById("a-"+encodeURIComponent(term));
  if(!box)return; box.classList.remove("hide");
  if(!SAMPLE){box.textContent="此檢視無法呼叫 Claude。";return;}
  btn.disabled=true; box.textContent="查詢中…";
  try{
    const{text}=await SAMPLE("食品成分「"+term+"」在台灣市售包裝食品中，通常的來源是什麼？"+
      "請用繁體中文回答，三行以內：(1) 最常見來源 (2) 是否可能來自蛋、奶或其他動物 (3) 買的時候該怎麼確認。不要開場白。",
      {modelTier:"quick",onText:u=>{box.textContent=u.text;}});
    box.textContent=text;
  }catch(e){
    box.textContent = e.code==="not_granted"||e.code==="sampling_disabled" ? "未取得呼叫 Claude 的授權。"
      : e.code==="rate_limited" ? "呼叫太頻繁，稍後再試。" : (e.text||"查詢失敗，請稍後再試。");
  }finally{btn.disabled=false;}
}

/* ── 判讀入口 ── */
function run(raw){
  raw=(raw||"").trim(); if(!raw)return;
  LAST={raw}; render();
  const d=judge(raw);
  const title=(raw.replace(/\s+/g," ").replace(/^成分[：:]\s*/,"").slice(0,26))||"未命名";
  const now=new Date(), pad=n=>String(n).padStart(2,"0");
  HIST=[{t:title,v:d.v,raw,d:(now.getMonth()+1)+"/"+now.getDate()+" "+pad(now.getHours())+":"+pad(now.getMinutes())},
        ...HIST.filter(x=>x.raw!==raw)].slice(0,25);
  save("prefs/history",{items:HIST}); render();
  requestAnimationFrame(()=>document.getElementById("verdict").scrollIntoView({behavior:"smooth",block:"start"}));
}

const srcEl=document.getElementById("src");
srcEl.addEventListener("keydown",e=>{if((e.metaKey||e.ctrlKey)&&e.key==="Enter")run(srcEl.value);});
document.getElementById("go").onclick=()=>run(srcEl.value);

const modeText=document.getElementById("mode-text"), modePhoto=document.getElementById("mode-photo"),
      textPane=document.getElementById("text-pane"), photoPane=document.getElementById("photo-pane"),
      photoFile=document.getElementById("photo-file"), photoPreview=document.getElementById("photo-preview"),
      photoNote=document.getElementById("photo-note");
function setMode(mode){
  const text=mode==="text";
  modeText.setAttribute("aria-selected",String(text)); modePhoto.setAttribute("aria-selected",String(!text));
  textPane.classList.toggle("hide",!text); photoPane.classList.toggle("hide",text);
  if(text)setTimeout(()=>srcEl.focus(),0);
}
modeText.onclick=()=>setMode("text");
modePhoto.onclick=()=>setMode("photo");
let photoURL="";
function showPhoto(file){
  if(!file||!file.type.startsWith("image/"))return;
  if(photoURL)URL.revokeObjectURL(photoURL);
  photoURL=URL.createObjectURL(file); photoPreview.src=photoURL;
  photoPreview.classList.remove("hide"); photoNote.classList.remove("hide");
}
photoFile.onchange=()=>{showPhoto(photoFile.files&&photoFile.files[0]);photoFile.value="";};
document.addEventListener("paste",e=>{
  const item=[...(e.clipboardData?.items||[])].find(x=>x.type.startsWith("image/"));
  if(item){e.preventDefault();setMode("photo");showPhoto(item.getAsFile());}
});
/* ── 啟動 ── */
loadPrefs(); ALLIUM="exclude"; render();


</script>
